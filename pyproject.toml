[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalscope"
version = "0.1.0"
description = "Media intelligence and research platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pgvector>=0.4",
    "pypdf>=6.0",
    "python-docx>=1.1",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.32",
]

[project.scripts]
signalscope = "signalscope.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]
# Runs embedding models on this machine. Brings in PyTorch and Transformers.
local-embeddings = [
    "sentence-transformers>=5.1",
]
# Runs the reranking model on this machine. Also brings in PyTorch.
local-reranking = [
    "sentence-transformers>=5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/signalscope"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# feedparser has no type information.
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# An optional extra, so it is often not installed where mypy runs.
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import helpers such as tests/sample_files.py.
pythonpath = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-rs"]
