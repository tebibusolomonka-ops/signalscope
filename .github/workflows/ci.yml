name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostgreSQL 17 with the pgvector extension, which SignalScope needs.
        image: pgvector/pgvector:pg17
        # Throwaway database for tests. These values are not secrets.
        env:
          POSTGRES_DB: signalscope_test
          POSTGRES_USER: signalscope
          POSTGRES_PASSWORD: signalscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalscope -d signalscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SIGNALSCOPE_TEST_DATABASE_URL: postgresql+asyncpg://signalscope:signalscope@localhost:5432/signalscope_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy src
